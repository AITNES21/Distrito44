# Despliegue en GitHub Pages.
# Solo se ejecuta al fusionar en "main" (o manualmente). Las ramas de trabajo
# NO publican nada.
#
# REQUISITO ÚNICO antes del primer despliegue:
#   GitHub → Settings → Pages → Build and deployment → Source: "GitHub Actions"
# (ahora mismo Pages sirve la raíz de la rama main tal cual; tras la migración
#  la web hay que compilarla, por eso cambia el origen).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run validate
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
